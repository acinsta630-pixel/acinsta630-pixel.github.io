<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYRO // THE UNLIMITED APEX</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Orbitron:wght@800;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Three.js + FontLoader + GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --bg: #030305;
            --gold-primary: #f3c64f;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            --glass: rgba(10, 11, 16, 0.65);
            --border: rgba(243, 198, 79, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Vazirmatn', sans-serif;
            color: #fff;
        }

        #canvas-webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Overlay UI */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(243, 198, 79, 0.4));
        }

        .sys-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--gold-primary);
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 8px 24px;
            border-radius: 40px;
            backdrop-filter: blur(20px);
        }

        /* Bottom Control Deck */
        .bottom-deck {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .deck-card {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(25px);
            padding: 25px 35px;
            border-radius: 24px;
            max-width: 380px;
            pointer-events: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
        }

        .deck-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--gold-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .deck-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .btn-godmode {
            pointer-events: auto;
            background: var(--gold-gradient);
            border: none;
            padding: 20px 45px;
            border-radius: 20px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(243, 198, 79, 0.4);
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-godmode:hover {
            transform: scale(1.08) translateY(-5px);
            box-shadow: 0 0 80px rgba(243, 198, 79, 0.7);
        }
    </style>
</head>
<body>

    <canvas id="canvas-webgl"></canvas>

    <div class="ui-layer">
        <header>
            <div class="brand-logo">RAYRO // SYSTEM</div>
            <div class="sys-status"><i class="fa-solid fa-bolt"></i> ULTRA PERFORMANCE</div>
        </header>

        <div class="bottom-deck">
            <div class="deck-card">
                <div class="deck-title">
                    <i class="fa-solid fa-crown"></i>
                    معماری قدرت و لوکس
                </div>
                <div class="deck-desc">
                    طراحی‌شده با موتورسازی سه‌بعدی زنده، نورپردازی سایه متحرک و ذرات طلایی شناور. ماوس را حرکت دهید تا زاویه نور استودیو تغییر کند.
                </div>
            </div>

            <button class="btn-godmode" onclick="triggerGodMode()">
                <i class="fa-solid fa-fire"></i>
                فعال‌سازی شوک سینمایی
            </button>
        </div>
    </div>

    <script>
        // --- THREE.JS HEAVY RENDER ENGINE ---
        const canvas = document.getElementById('canvas-webgl');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 14);

        // --- LIGHTING SETUP (STUDIO GRADE) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        // Moving Mouse Spotlight
        const mainSpot = new THREE.SpotLight(0xf3c64f, 12);
        mainSpot.position.set(5, 10, 8);
        mainSpot.angle = Math.PI / 4;
        mainSpot.penumbra = 0.8;
        mainSpot.castShadow = true;
        scene.add(mainSpot);

        // Rim Light (Blue-Steel Reflection)
        const rimLight = new THREE.PointLight(0x4a90e2, 6, 20);
        rimLight.position.set(-8, -2, -5);
        scene.add(rimLight);

        // --- 3D CORE OBJECT (HEAVY GEOMETRY) ---
        const group = new THREE.Group();
        scene.add(group);

        // Main Core Geometry: Torus Knot + Diamond Lattice
        const mainGeo = new THREE.TorusKnotGeometry(2.2, 0.65, 300, 32, 2, 3);
        const goldMat = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.95,
            roughness: 0.12,
            envMapIntensity: 2.5
        });

        const mainMesh = new THREE.Mesh(mainGeo, goldMat);
        mainMesh.castShadow = true;
        mainMesh.receiveShadow = true;
        group.add(mainMesh);

        // Outer Metallic Ring
        const ringGeo = new THREE.TorusGeometry(4.2, 0.08, 16, 100);
        const titaniumMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a24,
            metalness: 0.9,
            roughness: 0.2
        });
        const ringMesh = new THREE.Mesh(ringGeo, titaniumMat);
        group.add(ringMesh);

        // --- REFLECTION FLOOR ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x030305,
            metalness: 0.8,
            roughness: 0.3
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -3.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- GOLD DUST PARTICLES ---
        const particleCount = 1200;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 25;
            positions[i+1] = (Math.random() - 0.5) * 15;
            positions[i+2] = (Math.random() - 0.5) * 25;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xf3c64f,
            size: 0.04,
            transparent: true,
            opacity: 0.8
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- INTERACTION & MOUSE PARALLAX ---
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;

            // Move Spot Light with Mouse
            gsap.to(mainSpot.position, {
                x: mouseX * 8,
                y: mouseY * 6 + 8,
                duration: 1,
                ease: "power2.out"
            });
        });

        // --- GODMODE CINEMATIC ANIMATION ---
        function triggerGodMode() {
            // Camera Shock
            gsap.timeline()
                .to(camera.position, { z: 7, y: 0, duration: 1, ease: "power4.in" })
                .to(mainMesh.rotation, { x: Math.PI * 2, y: Math.PI * 4, duration: 2, ease: "expo.out" })
                .to(camera.position, { z: 14, y: 2, duration: 1.5, ease: "elastic.out(1, 0.4)" });

            // Light Explosion
            gsap.to(mainSpot, { intensity: 45, duration: 0.8, yoyo: true, repeat: 1 });
        }

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Continuous Floating
            group.rotation.y += 0.006;
            group.rotation.x = Math.sin(clock.getElapsedTime() * 0.8) * 0.15;
            ringMesh.rotation.z -= 0.003;

            // Mouse Smooth Parallax
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.03;
            camera.lookAt(0, 0, 0);

            // Particle Subtle Movement
            particleSystem.rotation.y += 0.0008;

            renderer.render(scene, camera);
        }
        animate();

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
