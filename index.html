<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYRO // GOD_MODE_INTERFACE</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Vazirmatn:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Three.js + GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --secondary: #7000ff;
            --accent: #ff0055;
            --cyber-blue: #00f0ff;
            --bg: #030308;
            --panel-bg: rgba(6, 9, 24, 0.65);
            --panel-border: rgba(0, 255, 136, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Vazirmatn', sans-serif;
            color: #fff;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Overlay Grid */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background: 
                linear-gradient(rgba(112, 0, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(112, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 2;
            pointer-events: none;
        }

        /* App Layout */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 80px 1fr;
            padding: 20px 40px;
            gap: 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 0 30px;
            backdrop-filter: blur(25px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 136, 0.1);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--primary), var(--cyber-blue), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .sys-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            color: var(--primary);
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid var(--primary);
            padding: 8px 18px;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        /* Main Workspace */
        main {
            display: grid;
            grid-template-columns: 340px 1fr 340px;
            gap: 20px;
            height: calc(100vh - 140px);
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .panel-title {
            font-family: 'Orbitron', 'Vazirmatn', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .panel-title i {
            color: var(--cyber-blue);
        }

        /* Control Items */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .control-slider {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .cyber-btn {
            position: relative;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(112, 0, 255, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .cyber-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.7);
        }

        .cyber-btn-outline {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cyber-btn-outline:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Middle Viewport Dynamic Text Overlay */
        .center-viewport {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .hero-title-box {
            margin-top: 40px;
        }

        .hero-title-box h1 {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff, rgba(255, 255, 255, 0.3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-title-box h1 span {
            background: linear-gradient(90deg, var(--primary), var(--cyber-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        /* Custom Stat Gauges */
        .stat-gauge {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gauge-val {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--cyber-blue);
        }

        /* Scrollbar styling */
        .panel::-webkit-scrollbar {
            width: 4px;
        }
        .panel::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>
    <div class="grid-overlay"></div>

    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-cube"></i>
                RAYRO // APEX_NEXUS
            </div>
            <div class="sys-badge">
                <div class="pulse-dot"></div>
                GOD_MODE: ACTIVE (HYPERVISOR)
            </div>
        </header>

        <main>
            <!-- Left Panel: Shaders & Physics Control -->
            <div class="panel">
                <div class="panel-title">
                    <i class="fa-solid fa-sliders"></i>
                    کنترل شیدرهای اختصاصی
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>فرکانس موج ورتکس</span>
                        <span id="freq-val">2.5</span>
                    </div>
                    <input type="range" class="control-slider" min="0.5" max="8.0" step="0.1" value="2.5" id="freq-slider">
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>سرعت چرخش کوانتومی</span>
                        <span id="speed-val">1.0</span>
                    </div>
                    <input type="range" class="control-slider" min="0.1" max="5.0" step="0.1" value="1.0" id="speed-slider">
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>تراکم میدان ذرات</span>
                        <span id="density-val">50,000</span>
                    </div>
                    <input type="range" class="control-slider" min="10000" max="100000" step="5000" value="50000" id="density-slider">
                </div>

                <button class="cyber-btn" onclick="triggerOverdrive()">
                    <i class="fa-solid fa-bolt"></i>
                    فعال‌سازی حالت OVERDRIVE
                </button>

                <button class="cyber-btn-outline" onclick="resetShaders()">
                    <i class="fa-solid fa-rotate-right"></i>
                    بازنشانی به پارامترهای استاندارد
                </button>
            </div>

            <!-- Center Viewport -->
            <div class="center-viewport">
                <div class="hero-title-box">
                    <h1>معماری آینده<br><span>برپایه GLSL Custom Shaders</span></h1>
                </div>
            </div>

            <!-- Right Panel: System Telemetry -->
            <div class="panel">
                <div class="panel-title">
                    <i class="fa-solid fa-microchip"></i>
                    تله‌متری پردازش گرافیکی
                </div>

                <div class="stat-gauge">
                    <div class="control-label">GPU RENDER LOAD</div>
                    <div class="gauge-val" id="gpu-load">14.2%</div>
                </div>

                <div class="stat-gauge">
                    <div class="control-label">VERTEX COUNT</div>
                    <div class="gauge-val">150,480</div>
                </div>

                <div class="stat-gauge">
                    <div class="control-label">FPS ENGINE</div>
                    <div class="gauge-val" style="color: var(--primary);">60.0 PERFECT</div>
                </div>

                <div style="margin-top: auto;">
                    <button class="cyber-btn-outline" style="width: 100%; border-color: var(--accent); color: var(--accent);" onclick="explodeGeometry()">
                        <i class="fa-solid fa-bomb"></i>
                        انفجار ذرات هندسی
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- GLSL WebGL Custom Engine Script -->
    <script>
        // Custom Vertex Shader
        const vertexShader = `
            uniform float uTime;
            uniform float uFrequency;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;

            // Simplex Noise Function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                
                // Displace Vertices using Custom Simplex Noise
                vec3 pos = position;
                float noise = snoise(vec3(pos * uFrequency + uTime * 0.5));
                pos += normal * noise * 2.5;

                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        // Custom Fragment Shader (Raymarching Cyber Hologram)
        const fragmentShader = `
            uniform float uTime;
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
                // Dynamic Color Mixing based on Position and Time
                float mixFactor = sin(vPosition.y * 0.2 + uTime) * 0.5 + 0.5;
                vec3 color = mix(uColorA, uColorB, mixFactor);

                // Fresnel Edge Glow Effect
                vec3 viewDir = normalize(-vPosition);
                float fresnel = pow(1.0 - max(dot(viewDir, vNormal), 0.0), 3.0);
                
                color += vec3(0.0, 1.0, 0.5) * fresnel * 2.0;

                // Grid Overlay inside Shader
                float grid = sin(vPosition.x * 10.0) * sin(vPosition.z * 10.0);
                grid = step(0.9, grid);
                color += vec3(grid * 0.5);

                gl_FragColor = vec4(color, 0.85);
            }
        `;

        // WebGL Setup
        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        // Custom Shader Material Setup
        const shaderUniforms = {
            uTime: { value: 0 },
            uFrequency: { value: 2.5 },
            uColorA: { value: new THREE.Color(0x7000ff) },
            uColorB: { value: new THREE.Color(0x00ff88) }
        };

        const geometry = new THREE.IcosahedronGeometry(7, 60);
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: shaderUniforms,
            wireframe: false,
            transparent: true
        });

        const sphereMesh = new THREE.Mesh(geometry, material);
        scene.add(sphereMesh);

        // Ambient Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);

        // Interactive Controls Setup
        const freqSlider = document.getElementById('freq-slider');
        const speedSlider = document.getElementById('speed-slider');
        let speedMultiplier = 1.0;

        freqSlider.addEventListener('input', (e) => {
            shaderUniforms.uFrequency.value = parseFloat(e.target.value);
            document.getElementById('freq-val').innerText = e.target.value;
        });

        speedSlider.addEventListener('input', (e) => {
            speedMultiplier = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = e.target.value;
        });

        function triggerOverdrive() {
            gsap.to(shaderUniforms.uFrequency, { value: 7.5, duration: 1, yoyo: true, repeat: 1 });
            gsap.to(sphereMesh.rotation, { y: sphereMesh.rotation.y + Math.PI * 4, duration: 2, ease: "power4.inOut" });
        }

        function resetShaders() {
            gsap.to(shaderUniforms.uFrequency, { value: 2.5, duration: 1 });
            freqSlider.value = 2.5;
            document.getElementById('freq-val').innerText = "2.5";
        }

        function explodeGeometry() {
            gsap.to(sphereMesh.scale, { x: 1.8, y: 1.8, z: 1.8, duration: 0.3, yoyo: true, repeat: 1, ease: "bounce.out" });
        }

        // Render Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            
            shaderUniforms.uTime.value = elapsedTime * speedMultiplier;
            sphereMesh.rotation.y = elapsedTime * 0.2 * speedMultiplier;
            sphereMesh.rotation.x = elapsedTime * 0.1 * speedMultiplier;

            // Fake GPU Load Variation
            document.getElementById('gpu-load').innerText = (12 + Math.sin(elapsedTime * 3) * 3).toFixed(1) + "%";

            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
