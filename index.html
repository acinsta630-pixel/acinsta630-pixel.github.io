<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MONSTER // LEVEL 20000</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Vazirmatn:wght@900&display=swap" rel="stylesheet">

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Vazirmatn', sans-serif;
            color: #fff;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Overlay Text */
        .overlay-hero {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .title-monster {
            font-family: 'Orbitron', 'Vazirmatn', sans-serif;
            font-size: clamp(3.5rem, 10vw, 9rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(180deg, #ffffff 0%, #ff0055 50%, #7928ca 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 80px rgba(255, 0, 85, 0.6);
            line-height: 0.95;
            margin-bottom: 20px;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }

        .subtitle-monster {
            font-size: clamp(1rem, 2vw, 1.8rem);
            color: #00f2fe;
            letter-spacing: 8px;
            text-shadow: 0 0 20px #00f2fe;
            font-weight: 900;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 25px rgba(255,0,85,0.4)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 70px rgba(121,40,202,0.9)); transform: scale(1.03); }
        }

        /* Action Trigger */
        .trigger-box {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .btn-supernova {
            background: linear-gradient(135deg, #ff0055, #7928ca, #00f2fe);
            background-size: 200% 200%;
            border: none;
            color: #fff;
            padding: 22px 60px;
            border-radius: 100px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.8);
            transition: all 0.4s ease;
            animation: gradientShift 4s ease infinite;
        }

        .btn-supernova:hover {
            transform: scale(1.15);
            box-shadow: 0 0 100px rgba(0, 242, 254, 1);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="overlay-hero">
        <h1 class="title-monster">LEVEL 20000</h1>
        <p class="subtitle-monster">غولِ مطلق • تک در دنیا</p>
    </div>

    <div class="trigger-box">
        <button class="btn-supernova" onclick="explodeCore()">انفجار کوانتومی 😈🔥</button>
    </div>

    <script>
        // THREE.JS ULTIMATE GRAPHICS ENGINE
        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        // 1. DYNAMIC PARTICLE VORTEX
        const particleCount = 6000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0xff0055);
        const color2 = new THREE.Color(0x00f2fe);

        for (let i = 0; i < particleCount; i++) {
            const radius = Math.random() * 50 + 5;
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI;

            particlePos[i * 3] = radius * Math.cos(theta) * Math.cos(phi);
            particlePos[i * 3 + 1] = radius * Math.sin(phi);
            particlePos[i * 3 + 2] = radius * Math.sin(theta) * Math.cos(phi);

            const mixedColor = color1.clone().lerp(color2, Math.random());
            particleColors[i * 3] = mixedColor.r;
            particleColors[i * 3 + 1] = mixedColor.g;
            particleColors[i * 3 + 2] = mixedColor.b;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.7,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // 2. MONSTER CRYSTAL CORE
        const coreGeo = new THREE.TorusKnotGeometry(8, 2.5, 200, 32);
        const coreMat = new THREE.MeshNormalMaterial({ wireframe: true });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        // Interactive Mouse Movement
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        let shockwave = 1;
        function explodeCore() {
            shockwave = 15;
            setTimeout(() => { shockwave = 1; }, 2000);
        }

        // Render Loop
        const clock = new THREE.Clock();
        function render() {
            requestAnimationFrame(render);
            const time = clock.getElapsedTime();

            // Core Rotations
            coreMesh.rotation.x = time * 0.4 * shockwave;
            coreMesh.rotation.y = time * 0.6 * shockwave;

            particleSystem.rotation.y = time * 0.08 * shockwave;

            // Parallax Effect
            camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 10 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        render();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
